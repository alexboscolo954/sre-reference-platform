name: images

on:
  push:
    paths: ["apps/**", ".github/workflows/images.yaml"]
  pull_request:
    paths: ["apps/**", ".github/workflows/images.yaml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [storefront, checkout]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/go.mod
          cache-dependency-path: apps/go.sum
      - run: go test ./...
        working-directory: apps
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps
          file: apps/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/alexboscolo954/${{ matrix.service }}:sha-${{ github.sha }}
