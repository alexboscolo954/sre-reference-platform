# 1 control plane + 3 workers: CloudNativePG runs one instance per worker,
# so killing a node still leaves 2/3.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-platform
networking:
  disableDefaultCNI: true # Cilium is the CNI
  kubeProxyMode: none     # Cilium replaces kube-proxy
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # Gateway listener (Cilium host network mode) -> macOS, loopback only
    extraPortMappings:
      - containerPort: 8080
        hostPort: 8080
        listenAddress: 127.0.0.1
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
