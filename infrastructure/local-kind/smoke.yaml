# Proves the path macOS localhost:8080 -> kind port mapping -> Cilium Gateway -> pod.
apiVersion: v1
kind: Namespace
metadata:
  name: smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: smoke
spec:
  replicas: 1
  selector:
    matchLabels: {app: podinfo}
  template:
    metadata:
      labels: {app: podinfo}
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports: [{containerPort: 9898}]
          readinessProbe:
            httpGet: {path: /readyz, port: 9898}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: smoke
spec:
  selector: {app: podinfo}
  ports: [{port: 80, targetPort: 9898}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: smoke
  namespace: smoke
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 8080 # unprivileged, so Envoy needs no NET_BIND_SERVICE
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: smoke
spec:
  parentRefs: [{name: smoke}]
  rules:
    - backendRefs: [{name: podinfo, port: 80}]
