# Gateway API needs kube-proxy replacement, so Cilium talks to the API server
# directly instead of through the (absent) kube-proxy ClusterIP.
kubeProxyReplacement: true
k8sServiceHost: sre-platform-control-plane
k8sServicePort: 6443
ipam:
  mode: kubernetes
gatewayAPI:
  enabled: true
  # Envoy listens on each node's own network; kind maps the control plane's
  # :8080 to macOS. No LoadBalancer Services, no cloud-provider-kind.
  hostNetwork:
    enabled: true
operator:
  replicas: 1
# Envoy binds each GAMMA upstream connection to the caller's address and port and
# keeps it open for this long. At the default 60s, a source port that storefront
# reuses after a promotion collides with the old connection (ADR 0012).
envoy:
  idleTimeoutDurationSeconds: 2
