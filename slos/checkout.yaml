# Checkout SLOs over Sloth's default 30d period. `make slo` turns this into
# gitops/monitoring/slo-rules.yaml (a PrometheusRule); CI fails if they drift.
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: checkout
  namespace: monitoring
spec:
  service: checkout
  slos:
    - name: requests-availability
      objective: 99.9
      description: "Shop requests through the Gateway (storefront, then checkout) that don't fail with a 5xx."
      sli:
        events:
          # Measured at the Gateway's storefront cluster, not inside checkout: in GameDay 0001
          # checkout's own counters missed both outages (Envoy rejected requests before they
          # reached it, and liveness killed pods before their errors were scraped).
          # "completed" counts every response, Envoy's own 503s included. Errors are what is left
          # after 2xx-4xx, because Envoy creates the 5xx series at the first error and rate()
          # cannot see the step to its first sample. A first 4xx is counted as an error for one
          # scrape in the same way; that is the price of seeing every first 5xx.
          errorQuery: |
            sum(rate(envoy_cluster_upstream_rq_completed{envoy_cluster_name="gateway/cilium-gateway-shared/shop_storefront_80"}[{{.window}}]))
            -
            (sum(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name="gateway/cilium-gateway-shared/shop_storefront_80",envoy_response_code_class=~"2|3|4"}[{{.window}}])) or vector(0))
          # "> 0": with no traffic the SLI is 0/0 = NaN, and one NaN sample turns Sloth's 30d
          # average (sum_over_time / count_over_time of the 5m SLI) into NaN for 30 days.
          # Dropping idle samples averages only over time with traffic.
          totalQuery: sum(rate(envoy_cluster_upstream_rq_completed{envoy_cluster_name="gateway/cilium-gateway-shared/shop_storefront_80"}[{{.window}}])) > 0
      alerting:
        name: CheckoutAvailabilityBudgetBurn
        annotations:
          summary: "Checkout is burning its availability error budget too fast."
        pageAlert: {labels: {severity: page}}
        ticketAlert: {labels: {severity: ticket}}
    - name: requests-latency
      objective: 99
      description: "Checkout requests served in under 300ms."
      sli:
        events:
          # Slow = all requests minus those in the 0.3s bucket.
          errorQuery: |
            sum(rate(http_server_request_duration_seconds_count{namespace="shop",route="POST /checkout"}[{{.window}}]))
            -
            sum(rate(http_server_request_duration_seconds_bucket{namespace="shop",route="POST /checkout",le="0.3"}[{{.window}}]))
          totalQuery: sum(rate(http_server_request_duration_seconds_count{namespace="shop",route="POST /checkout"}[{{.window}}])) > 0 # see availability
      alerting:
        name: CheckoutLatencyBudgetBurn
        annotations:
          summary: "Checkout is burning its latency error budget too fast."
        pageAlert: {labels: {severity: page}}
        ticketAlert: {labels: {severity: ticket}}
