[tools]
kind = "0.33.0"
kubectl = "1.37.1"
helm = "4.3.1"
cilium-cli = "0.20.1"
age = "1.3.1"
sops = "3.13.3"
go = "1.27.3"
"aqua:slok/sloth" = "0.16.0"
yq = "4.54.1"
promtool = "3.15.1" # same as the cluster's Prometheus
k6 = "2.3.0"
argo-rollouts = "1.10.2" # kubectl-argo-rollouts, same as the controller

# Keep this cluster away from everything else on the machine:
# own kubeconfig (never ~/.kube/config) and own Docker network (never "kind").
[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
KIND_EXPERIMENTAL_DOCKER_NETWORK = "sre-platform"
