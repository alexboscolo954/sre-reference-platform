apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexboscolo954/sre-reference-platform
    targetRevision: stage2/metrics
    path: gitops/shop
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true # CNPG Cluster CRD arrives from cnpg-operator
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
