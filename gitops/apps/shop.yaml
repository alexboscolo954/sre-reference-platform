apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexboscolo954/sre-reference-platform
    targetRevision: stage3/rollouts
    path: gitops/shop
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  # Argo Rollouts owns the canary weights and the ping/pong selectors (ADR 0010).
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: checkout
      jsonPointers: [/spec/rules/0/backendRefs]
    - kind: Service
      name: checkout-ping
      jsonPointers: [/spec/selector/rollouts-pod-template-hash]
    - kind: Service
      name: checkout-pong
      jsonPointers: [/spec/selector/rollouts-pod-template-hash]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true # CNPG Cluster and Rollout CRDs arrive from their operators
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
