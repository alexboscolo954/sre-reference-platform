apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 20.2.1
      helm:
        valueFiles:
          - $values/gitops/observability/loki-values.yaml
    - repoURL: https://github.com/alexboscolo954/sre-reference-platform
      targetRevision: stage3/rollouts
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
