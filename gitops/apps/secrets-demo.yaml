apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexboscolo954/sre-reference-platform
    targetRevision: stage2/metrics
    path: gitops/secrets-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: secrets-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
