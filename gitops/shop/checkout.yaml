apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: checkout
  namespace: shop
spec:
  replicas: 2
  strategy:
    canary:
      stableService: checkout-stable
      canaryService: checkout-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: checkout
            namespace: shop
      steps:
        - setWeight: 20
        - pause: {duration: 2m}
        - setWeight: 50
        - pause: {duration: 2m}
        - setWeight: 100
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
      annotations: {release: "3"} # bump to start a canary without a new image
    spec:
      containers:
        - name: checkout
          image: ghcr.io/alexboscolo954/checkout
          ports: [{containerPort: 8080}, {name: metrics, containerPort: 9090}]
          env:
            - {name: LATENCY_MS, value: "0"}
            - {name: ERROR_RATE, value: "0"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-gateway.monitoring:4317"}
            - {name: VALKEY_ADDR, value: "valkey:6379"}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: shop-db-app, key: uri}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: shop
spec:
  selector: {app: checkout}
  ports: [{port: 80, targetPort: 8080}]
---
# Rollouts adds rollouts-pod-template-hash to these selectors.
apiVersion: v1
kind: Service
metadata:
  name: checkout-stable
  namespace: shop
spec:
  selector: {app: checkout}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-canary
  namespace: shop
spec:
  selector: {app: checkout}
  ports: [{port: 80, targetPort: 8080}]
