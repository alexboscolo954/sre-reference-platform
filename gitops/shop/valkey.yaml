apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: valkey}
  template:
    metadata:
      labels: {app: valkey}
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1-alpine
          args: ["--save", "", "--appendonly", "no"] # counter cache, no persistence
          ports: [{containerPort: 6379}]
          readinessProbe:
            tcpSocket: {port: 6379}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: shop
spec:
  selector: {app: valkey}
  ports: [{port: 6379}]
