# GAMMA producer route: storefront -> Service checkout is split between
# stable and canary. Argo Rollouts' Gateway API plugin owns the weights.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: checkout
  namespace: shop
spec:
  parentRefs:
    - {group: "", kind: Service, name: checkout, port: 80}
  rules:
    - backendRefs:
        - {name: checkout-stable, port: 80, weight: 100}
        - {name: checkout-canary, port: 80, weight: 0}
