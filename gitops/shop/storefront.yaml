apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: {app: storefront}
  template:
    metadata:
      labels: {app: storefront}
    spec:
      containers:
        - name: storefront
          image: ghcr.io/alexboscolo954/storefront
          ports: [{containerPort: 8080}, {name: metrics, containerPort: 9090}]
          env:
            - {name: LATENCY_MS, value: "0"}
            - {name: ERROR_RATE, value: "0"}
            - {name: CHECKOUT_URL, value: "http://checkout"}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: shop
spec:
  selector: {app: storefront}
  ports: [{port: 80, targetPort: 8080}]
