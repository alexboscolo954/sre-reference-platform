# Single binary on the filesystem, no persistence: logs live in an emptyDir for the 2d of a demo cluster.
deploymentMode: Monolithic
loki:
  auth_enabled: false
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
  limits_config:
    retention_period: 48h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  persistence: {enabled: false}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
# The chart defaults to simple-scalable replicas too; zero them.
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
# Clients talk to loki:3100 directly; no nginx gateway, memcached, canary or test pod.
gateway: {enabled: false}
resultsCache: {enabled: false}
chunksCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
