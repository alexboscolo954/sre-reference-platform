# kind has no etcd/scheduler/controller-manager metrics endpoints reachable, and Cilium replaces kube-proxy.
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}

prometheus:
  prometheusSpec:
    retention: 2d
    enableFeatures: [exemplar-storage]
    # Pick up every PodMonitor/ServiceMonitor/PrometheusRule, not just those labelled with the Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 1Gi}

alertmanager:
  alertmanagerSpec:
    # The Slack webhook URL (SOPS, gitops/monitoring) lands at /etc/alertmanager/secrets/alertmanager-slack/url.
    secrets: [alertmanager-slack]
  config:
    # Only SLO burn alerts (Sloth's severity page/ticket) reach Slack; the chart's
    # default alerts (warning/critical, several always firing on kind) go nowhere.
    route:
      receiver: "null"
      group_by: [alertname, sloth_slo, severity]
      routes:
        - receiver: slack
          matchers: ['severity=~"page|ticket"']
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
            text: '{{ range .Alerts }}{{ .Annotations.title }}{{ "\n" }}{{ end }}'

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
  additionalDataSources:
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring:3200
      jsonData:
        # Span -> its logs: Loki lines from the same service containing the trace ID.
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          tags: [{key: service.name, value: service_name}]
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring:3100
      jsonData:
        # Access log -> its trace. "$$" escapes Grafana's env-var expansion in provisioned datasources.
        derivedFields:
          - name: TraceID
            matcherRegex: '"trace_id":"(\w+)"'
            datasourceUid: tempo
            url: "$${__value.raw}"
            urlDisplayLabel: View trace
  sidecar:
    datasources:
      # Histogram exemplars link to the trace in Tempo via their trace_id label.
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
