resources:
  - httproute.yaml
  - slo-rules.yaml
generators:
  - secret-generator.yaml
# Grafana's sidecar loads any ConfigMap labelled grafana_dashboard=1 in this namespace.
# Sloth dashboards: grafana.com 14348 rev 5 (detail), 14643 rev 2 (high level), DS_PROMETHEUS -> uid prometheus.
configMapGenerator:
  - name: dashboards
    files:
      - dashboards/checkout-overview.json
      - dashboards/sloth-slo-detail.json
      - dashboards/sloth-slo-high-level.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
